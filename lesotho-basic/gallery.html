<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visit Lesotho - Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>


  <header>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Visit Lesotho</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Open menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About Lesotho</a></li>
            <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item ms-lg-3">
              <button id="themeBtn" class="btn btn-outline-dark">🌙 Dark</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>

    <section class="hero py-5">
      <h1>Photo Gallery</h1>
      <p class="mb-0">Click a photo to make it bigger</p>
    </section>

    <section>
      <div class="container">
        <div class="gallery">
          <img src="3.jpg" alt="Maletsunyane Falls">
          <img src="4.jpg" alt="Thaba Bosiu">
          <img src="2.jpg" alt="Katse Dam">
          <img src="pass.jpeg" alt="Sani Pass">
          <img src="pass.jpeg" alt="Afriski in winter">
          <img src="thebe.jpeg" alt="Sehlabathebe National Park">
          <img src="tshehla.jpeg" alt="Ts'ehlanyane forest">
          <img src="malea.jpeg" alt="Pony trekking in Malealea">
          <img src="village.jpeg" alt="Basotho village">
        </div>
      </div>
    </section>
  </main>


  <div class="modal fade" id="photoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="photoTitle">Photo</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <img id="bigPhoto" src="" alt="" class="img-fluid w-100 rounded">
        </div>
        <div class="modal-footer justify-content-between">
          <button id="prevBtn" class="btn btn-primary">&larr; Previous</button>
          <button id="nextBtn" class="btn btn-primary">Next &rarr;</button>
        </div>
      </div>
    </div> 

  <footer>
    <p class="mb-0">&copy; 2026 Visit Lesotho | Web Design Assignment (DIWD2110)</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
